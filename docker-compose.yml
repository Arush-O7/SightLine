# The site and a PostgreSQL database together:  docker compose up --build
# Then open http://localhost:8787. Settings (Google, SMTP, PUBLIC_URL) come from .env.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: sightline
      POSTGRES_DB: sightline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sightline -d sightline']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - '8787:8787'
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://sightline:sightline@db:5432/sightline
      DATABASE_SSL: '0'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
